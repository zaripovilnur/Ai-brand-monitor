# nginx перед программой: пароль на весь сервис и, когда появится домен, HTTPS.
# Скопировать в /etc/nginx/sites-available/ai-brand-monitor,
# затем: ln -s ../sites-available/ai-brand-monitor /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;            # заменить на домен, когда он появится

    # Пароль на весь сервис. Файл создаётся так:
    #   apt install apache2-utils
    #   htpasswd -c /etc/nginx/.htpasswd marketing
    auth_basic "Мониторинг бренда";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Прогон идёт долго, ответы моделей ждём терпеливо
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Когда домен появится:
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d monitoring.example.ru
# certbot сам добавит сюда HTTPS и перенаправление с http на https.
